name: workshop_app
description: "Fleet Geeks Workshop app: board, gate QR, technician jobs with big buttons (offline), checklist, QC, parts, evidence, signatures."
version: 1.1.0+2
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fg_core:
    path: ../../packages/fg_core
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  uuid: ^4.5.1
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Launcher icon and splash generators (run once after tools/prepare_android.ps1, see mobile/README.md).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true

# dart run flutter_launcher_icons   (PNG sources rendered from mobile/assets/brand/*.svg by tools/render_brand.ps1)
# The workshop icon uses the graphite tile so both apps are told apart on one phone.
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "../../assets/brand/png/icon-workshop.png"
  adaptive_icon_background: "#162125"
  adaptive_icon_foreground: "../../assets/brand/png/foreground-workshop.png"
  adaptive_icon_monochrome: "../../assets/brand/png/monochrome.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B5554"
  image: "../../assets/brand/png/splash.png"
  color_dark: "#0F171A"
  image_dark: "../../assets/brand/png/splash.png"
  android_12:
    color: "#0B5554"
    image: "../../assets/brand/png/splash-android12.png"
    color_dark: "#0F171A"
    image_dark: "../../assets/brand/png/splash-android12.png"
  android: true
  ios: false
  web: false
