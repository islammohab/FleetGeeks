name: customer_app
description: Fleet Geeks Customer app: home dashboard, vehicles, booking wizard with arrival QR, faults, service orders and estimate decisions.
version: 1.1.0+2
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fg_core:
    path: ../../packages/fg_core
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  # Open downloaded PDFs (condition report, release note, service book) with the phone's viewer.
  open_filex: ^4.7.0
  # Payment links open in the browser.
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Launcher icon and splash generators (run once after tools/prepare_android.ps1, see mobile/README.md).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true

# dart run flutter_launcher_icons   (PNG sources rendered from mobile/assets/brand/*.svg by tools/render_brand.ps1)
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "../../assets/brand/png/icon-customer.png"
  # Adaptive icon (Android 8+): a plain colour background (no PNG) + the mark as foreground, monochrome for themed icons.
  adaptive_icon_background: "#0E6B67"
  adaptive_icon_foreground: "../../assets/brand/png/foreground-customer.png"
  adaptive_icon_monochrome: "../../assets/brand/png/monochrome.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B5554"
  image: "../../assets/brand/png/splash.png"
  color_dark: "#0F171A"
  image_dark: "../../assets/brand/png/splash.png"
  android_12:
    color: "#0B5554"
    image: "../../assets/brand/png/splash-android12.png"
    color_dark: "#0F171A"
    image_dark: "../../assets/brand/png/splash-android12.png"
  android: true
  ios: false
  web: false
